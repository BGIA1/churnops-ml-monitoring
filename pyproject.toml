[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "churnops-ml-monitoring"
version = "0.1.0"
description = "Local-first, cloud-ready churn MLOps monitoring and retraining system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ChurnOps Contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "jinja2>=3.1,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.8,<1",
  "types-pyyaml>=6.0",
]

[project.scripts]
churnops = "churnops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/churnops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
packages = ["churnops"]
strict = true
warn_unused_ignores = false
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: cross-component integration tests",
]

[tool.coverage.run]
source = ["churnops"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

